name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:runtime
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
  # Live tests are deliberately not run on untrusted PRs. Run from a trusted staging environment.
  deploy:
    name: Deploy production
    needs: local
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ez-transfer-production
      cancel-in-progress: false
    env:
      APP_ORIGIN: auto
      TRANSFER_MODE: production
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      SHARE_CODE_ACTIVE_KEY: ${{ vars.SHARE_CODE_ACTIVE_KEY || 'v1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate production configuration
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['SUPABASE_URL', 'R2_ACCOUNT_ID', 'R2_BUCKET']) {
            if (!process.env[name]) throw new Error(`Missing GitHub configuration: ${name}`);
          }
          NODE
      - run: npm run build
      - run: npx cf deploy --prebuilt --mode production --dry-run
      - name: Prepare Worker secrets
        env:
          WORKER_SECRETS_JSON: ${{ secrets.WORKER_SECRETS_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const secrets = JSON.parse(process.env.WORKER_SECRETS_JSON || '{}');
          const names = ['SUPABASE_SERVICE_ROLE_KEY', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'SHARE_CODE_KEYS'];
          for (const name of names) {
            if (typeof secrets[name] !== 'string' || !secrets[name]) throw new Error(`Missing Worker secret: ${name}`);
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'ez-transfer-secrets.json'), JSON.stringify(Object.fromEntries(names.map(name => [name, secrets[name]]))), { mode: 0o600 });
          NODE
      - name: Check this commit is still the latest main
        id: latest
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$latest" ]; then
            echo "Cannot determine current main commit"
            exit 1
          fi
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: a newer commit is already on main"
          fi
      - name: Deploy Worker and static assets
        if: steps.latest.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx cf deploy --prebuilt --mode production --secrets-file "$RUNNER_TEMP/ez-transfer-secrets.json"
      - name: Remove temporary secrets file
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { rmSync } from 'node:fs';
          import { join } from 'node:path';
          rmSync(join(process.env.RUNNER_TEMP, 'ez-transfer-secrets.json'), { force: true });
          NODE
